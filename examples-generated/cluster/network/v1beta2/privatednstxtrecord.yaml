apiVersion: network.azure.upbound.io/v1beta2
kind: PrivateDNSTXTRecord
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/privatednstxtrecord
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    privateDnsZoneIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    record:
    - value: v=spf1 mx ~all
    ttl: 300

---

apiVersion: network.azure.upbound.io/v1beta2
kind: PrivateDNSZone
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/privatednstxtrecord
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/privatednstxtrecord
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    location: West Europe
