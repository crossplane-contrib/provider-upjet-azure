apiVersion: recoveryservices.azure.upbound.io/v1beta3
kind: Vault
metadata:
  annotations:
    meta.upbound.io/example-id: recoveryservices/v1beta3/vault
  labels:
    testing.upbound.io/example-name: vault
  name: vault
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    sku: Standard

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: recoveryservices/v1beta3/vault
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    location: West Europe
