apiVersion: hdinsight.azure.upbound.io/v1beta3
kind: SparkCluster
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta3/sparkcluster
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    clusterVersion: "5.1"
    componentVersion:
      spark: "3.3"
    gateway:
      passwordSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
      username: acctestusrgw
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    roles:
      headNode:
        passwordSecretRef:
          key: example-key
          name: example-secret
          namespace: upbound-system
        username: acctestusrvm
        vmSize: Standard_A4_V2
      workerNode:
        passwordSecretRef:
          key: example-key
          name: example-secret
          namespace: upbound-system
        targetInstanceCount: 3
        username: acctestusrvm
        vmSize: Standard_A4_V2
      zookeeperNode:
        passwordSecretRef:
          key: example-key
          name: example-secret
          namespace: upbound-system
        username: acctestusrvm
        vmSize: Standard_A4_V2
    storageAccount:
    - isDefault: true
      storageAccountKeySecretRef:
        key: attribute.primary_access_key
        name: example-storage-account
        namespace: upbound-system
      storageContainerUrlSelector:
        matchLabels:
          testing.upbound.io/example-name: example
    tier: Standard
    tlsMinVersion: "1.2"

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta3/sparkcluster
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    location: West Europe

---

apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta3/sparkcluster
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: storage.azure.upbound.io/v1beta2
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta3/sparkcluster
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    containerAccessType: private
    storage_account_name: hdinsightstor
