apiVersion: security.azure.m.upbound.io/v1beta1
kind: AdvancedThreatProtection
metadata:
  annotations:
    meta.upbound.io/example-id: security/v1beta1/advancedthreatprotection
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    enabled: true
    targetResourceId: ${azurerm_cosmosdb_account.example.id}

---

apiVersion: cosmosdb.azure.m.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: security/v1beta1/advancedthreatprotection
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    consistencyPolicy:
      consistencyLevel: Eventual
    geoLocation:
    - failoverPriority: 0
      location: West Europe
    location: West Europe
    offerType: Standard
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: security/v1beta1/advancedthreatprotection
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
