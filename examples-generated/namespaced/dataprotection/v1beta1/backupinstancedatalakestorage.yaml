apiVersion: dataprotection.azure.m.upbound.io/v1beta1
kind: BackupInstanceDataLakeStorage
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    backupPolicyDataLakeStorageIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    dataProtectionBackupVaultIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    location: West Europe
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    storageContainerNamesRefs:
    - name: example
    - name: example2

---

apiVersion: dataprotection.azure.m.upbound.io/v1beta1
kind: BackupPolicyDataLakeStorage
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    backupSchedule:
    - R/2021-05-23T02:30:00+00:00/P1W
    dataProtectionBackupVaultIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    defaultRetentionDuration: P4M

---

apiVersion: dataprotection.azure.m.upbound.io/v1beta1
kind: BackupVault
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    datastoreType: VaultStore
    identity:
      type: SystemAssigned
    location: West Europe
    redundancy: LocallyRedundant
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe

---

apiVersion: authorization.azure.m.upbound.io/v1beta1
kind: RoleAssignment
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    principalId: ${azurerm_data_protection_backup_vault.example.identity[0].principal_id}
    roleDefinitionName: Storage Account Backup Contributor
    scope: ${azurerm_storage_account.example.id}

---

apiVersion: storage.azure.m.upbound.io/v1beta1
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    isHnsEnabled: true
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: storage.azure.m.upbound.io/v1beta1
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: storage.azure.m.upbound.io/v1beta1
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example2
  name: example2
  namespace: upbound-system
spec:
  forProvider:
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
