apiVersion: cognitiveservices.azure.m.upbound.io/v1beta1
kind: AccountConnectionEntraID
metadata:
  annotations:
    meta.upbound.io/example-id: cognitiveservices/v1beta1/accountconnectionentraid
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    category: AzureOpenAI
    cognitiveAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    metadata:
      ApiType: Azure
      Location: West Europe
      ResourceId: ${azurerm_cognitive_account.openai.id}
    targetSelector:
      matchLabels:
        testing.upbound.io/example-name: openai

---

apiVersion: cognitiveservices.azure.m.upbound.io/v1beta1
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: cognitiveservices/v1beta1/accountconnectionentraid
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    customSubdomainName: exampleaiservices
    identity:
      type: SystemAssigned
    kind: AIServices
    location: West Europe
    projectManagementEnabled: true
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    skuName: S0

---

apiVersion: cognitiveservices.azure.m.upbound.io/v1beta1
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: cognitiveservices/v1beta1/accountconnectionentraid
  labels:
    testing.upbound.io/example-name: openai
  name: openai
  namespace: upbound-system
spec:
  forProvider:
    identity:
      type: SystemAssigned
    kind: OpenAI
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    skuName: S0

---

apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: cognitiveservices/v1beta1/accountconnectionentraid
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
