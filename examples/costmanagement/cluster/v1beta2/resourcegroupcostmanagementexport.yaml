apiVersion: costmanagement.azure.upbound.io/v1beta2
kind: ResourceGroupCostManagementExport
metadata:
  annotations:
    meta.upbound.io/example-id: costmanagement/v1beta2/resourcegroupcostmanagementexport
  labels:
    testing.upbound.io/example-name: resourcegroupcostmanagementexport
  name: example
spec:
  forProvider:
    exportDataOptions:
      timeFrame: TheLastMonth
      type: Usage
    exportDataStorageLocation:
      containerIdSelector:
        matchLabels:
          testing.upbound.io/example-name: resourcegroupcostmanagementexport
      rootFolderPath: root/updated
    recurrencePeriodEndDate: "2029-01-01T00:00:00Z"
    recurrencePeriodStartDate: "2028-01-01T00:00:00Z"
    recurrenceType: Monthly
    resourceGroupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: resourcegroupcostmanagementexport

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: costmanagement/v1beta1/resourcegroupcostmanagementexport
  labels:
    testing.upbound.io/example-name: resourcegroupcostmanagementexport
  name: cost-example
spec:
  forProvider:
    location: West Europe

---

apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: costmanagement/v1beta2/resourcegroupcostmanagementexport
  labels:
    testing.upbound.io/example-name: resourcegroupcostmanagementexport
  name: costacc5cb61fa0
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: resourcegroupcostmanagementexport

---

apiVersion: storage.azure.upbound.io/v1beta2
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: costmanagement/v1beta2/resourcegroupcostmanagementexport
  labels:
    testing.upbound.io/example-name: resourcegroupcostmanagementexport
  name: example-resourcegroupcostmanagementexport
spec:
  forProvider:
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: resourcegroupcostmanagementexport
