apiVersion: spring.azure.m.upbound.io/v1beta1
kind: CloudApplicationLiveView
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    uptest.upbound.io/timeout: "7200"
    meta.upbound.io/example-id: spring/v1beta1/cloudapplicationliveview
  labels:
    testing.upbound.io/example-name: example
  name: default
  namespace: upbound-system
spec:
  forProvider:
    springCloudServiceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of CloudApplicationLiveView. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: spring/v1beta1/cloudapplicationliveview
  labels:
    testing.upbound.io/example-name: example
  name: calvexample
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: appplatform.azure.m.upbound.io/v1beta1
kind: SpringCloudService
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: spring/v1beta1/cloudapplicationliveview
  labels:
    testing.upbound.io/example-name: example
  name: calvexample
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    skuName: E0
