apiVersion: containerapp.azure.upbound.io/v1beta1
kind: Environment
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta1/environment
  labels:
    testing.upbound.io/example-name: environment
  name: example-environment
spec:
  forProvider:
    location: Sweden Central
    logAnalyticsWorkspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: environment
    logsDestination: log-analytics
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: environment

---

apiVersion: operationalinsights.azure.upbound.io/v1beta3
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta1/environment
  labels:
    testing.upbound.io/example-name: environment
  name: example-environment
spec:
  forProvider:
    location: Sweden Central
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: environment
    retentionInDays: 30
    sku: PerGB2018

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta1/environment
  labels:
    testing.upbound.io/example-name: environment
  name: example-environment
spec:
  forProvider:
    location: Sweden Central
