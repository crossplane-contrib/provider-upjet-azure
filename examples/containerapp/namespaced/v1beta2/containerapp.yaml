apiVersion: containerapp.azure.m.upbound.io/v1beta2
kind: ContainerApp
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta2/containerapp
  labels:
    testing.upbound.io/example-name: containerapp
  name: example
  namespace: upbound-system
spec:
  forProvider:
    containerAppEnvironmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: containerapp
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: containerapp
    revisionMode: Single
    template:
      container:
        - cpu: 0.25
          image: mcr.microsoft.com/azuredocs/containerapps-helloworld:latest
          memory: 0.5Gi
          name: examplecontainerapp
---
apiVersion: containerapp.azure.m.upbound.io/v1beta1
kind: Environment
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta2/containerapp
  labels:
    testing.upbound.io/example-name: containerapp
  name: example-containerapp
  namespace: upbound-system
spec:
  forProvider:
    location: Sweden Central
    logAnalyticsWorkspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: containerapp
    logsDestination: log-analytics
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: containerapp
---
apiVersion: operationalinsights.azure.m.upbound.io/v1beta2
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta2/containerapp
  labels:
    testing.upbound.io/example-name: containerapp
  name: example-containerapp
  namespace: upbound-system
spec:
  forProvider:
    location: Sweden Central
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: containerapp
    retentionInDays: 30
    sku: PerGB2018
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta2/containerapp
  labels:
    testing.upbound.io/example-name: containerapp
  name: example-containerapp
  namespace: upbound-system
spec:
  forProvider:
    location: Sweden Central
