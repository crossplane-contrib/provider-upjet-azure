apiVersion: containerapp.azure.m.upbound.io/v1beta1
kind: Environment
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta1/environment
  labels:
    testing.upbound.io/example-name: environment
  name: example-environment
  namespace: upbound-system
spec:
  forProvider:
    location: Sweden Central
    logAnalyticsWorkspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: environment
    logsDestination: log-analytics
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: environment
---
apiVersion: operationalinsights.azure.m.upbound.io/v1beta2
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta1/environment
  labels:
    testing.upbound.io/example-name: environment
  name: example-environment
  namespace: upbound-system
spec:
  forProvider:
    location: Sweden Central
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: environment
    retentionInDays: 30
    sku: PerGB2018
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: containerapp/v1beta1/environment
  labels:
    testing.upbound.io/example-name: environment
  name: example-environment
  namespace: upbound-system
spec:
  forProvider:
    location: Sweden Central
