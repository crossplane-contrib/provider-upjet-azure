apiVersion: dataprotection.azure.upbound.io/v1beta1
kind: BackupInstanceDataLakeStorage
metadata:
  annotations:
    crossplane.io/paused: "true"
    uptest.upbound.io/pre-assert-hook: ../testhooks/prepare-backupinstancedatalakestorage.sh
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-backupinstancedatalakestorage.sh
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    backupPolicyDataLakeStorageIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    dataProtectionBackupVaultIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    location: West Europe
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    storageContainerNamesRefs:
    - name: example
    - name: example2

---

apiVersion: dataprotection.azure.upbound.io/v1beta1
kind: BackupPolicyDataLakeStorage
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    backupSchedule:
    - R/2021-05-23T02:30:00+00:00/P1W
    dataProtectionBackupVaultIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    defaultRetentionDuration: P4M

---

apiVersion: dataprotection.azure.upbound.io/v1beta2
kind: BackupVault
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    datastoreType: VaultStore
    identity:
      type: SystemAssigned
    location: West Europe
    redundancy: LocallyRedundant
    softDelete: "Off"
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    location: West Europe

---

apiVersion: authorization.azure.upbound.io/v1beta1
kind: RoleAssignment
metadata:
  annotations:
    crossplane.io/paused: "true"
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    # The pre-assert hook replaces these placeholders before resuming reconciliation.
    principalId: 00000000-0000-0000-0000-000000000000
    principalType: ServicePrincipal
    roleDefinitionName: Storage Account Backup Contributor
    scope: /subscriptions/00000000-0000-0000-0000-000000000000
    skipServicePrincipalAadCheck: true

---

apiVersion: storage.azure.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    crossplane.io/paused: "true"
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    isHnsEnabled: true
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: storage.azure.upbound.io/v1beta1
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: dataprotection/v1beta1/backupinstancedatalakestorage
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: storage.azure.upbound.io/v1beta1
kind: Container
metadata:
  annotations:
