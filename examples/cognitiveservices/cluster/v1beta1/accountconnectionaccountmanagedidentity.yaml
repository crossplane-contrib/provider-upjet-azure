apiVersion: cognitiveservices.azure.upbound.io/v1beta1
kind: AccountConnectionAccountManagedIdentity
metadata:
  annotations:
    meta.upbound.io/example-id: cognitiveservices/v1beta1/accountconnectionaccountmanagedidentity
  labels:
    testing.upbound.io/example-name: example
  name: example-connection-managed-identity
spec:
  forProvider:
    category: AzureStorageAccount
    cognitiveAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    metadata:
      ApiType: Azure
      Location: westeurope
      ResourceId: ${data.azurerm_client_config.current.subscription_resource_id}/resourceGroups/accountconnectionaccountmanagedidentity/providers/Microsoft.Storage/storageAccounts/cogconnmi6f3a
    target: https://cogconnmi6f3a.blob.core.windows.net/

---

apiVersion: cognitiveservices.azure.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: cognitiveservices/v1beta1/accountconnectionaccountmanagedidentity
  labels:
    testing.upbound.io/example-name: example
  name: accountconnectionaccountmanagedidentity
spec:
  forProvider:
    customSubdomainName: uptest-${Rand.RFC1123Subdomain}
    identity:
      type: SystemAssigned
    kind: AIServices
    location: West Europe
    projectManagementEnabled: true
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    skuName: S0

---

apiVersion: storage.azure.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: cognitiveservices/v1beta1/accountconnectionaccountmanagedidentity
  labels:
    testing.upbound.io/example-name: example
  name: cogconnmi6f3a
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: cognitiveservices/v1beta1/accountconnectionaccountmanagedidentity
  labels:
    testing.upbound.io/example-name: example
  name: accountconnectionaccountmanagedidentity
spec:
  forProvider:
    location: West Europe
