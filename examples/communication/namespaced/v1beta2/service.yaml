apiVersion: communication.azure.m.upbound.io/v1beta2
kind: Service
metadata:
  annotations:
    meta.upbound.io/example-id: communication/v1beta2/service
  labels:
    testing.upbound.io/example-name: service
  name: servicename
  namespace: upbound-system
spec:
  forProvider:
    dataLocation: United States
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgrouplabel
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: communication/v1beta2/service
  labels:
    testing.upbound.io/example-name: rgrouplabel
  name: rgroup-name
  namespace: upbound-system
spec:
  forProvider:
    location: East US
