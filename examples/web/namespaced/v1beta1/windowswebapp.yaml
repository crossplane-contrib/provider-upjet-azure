apiVersion: web.azure.m.upbound.io/v1beta1
kind: WindowsWebApp
metadata:
  annotations:
    meta.upbound.io/example-id: web/v1beta2/windowswebapp
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: windowswebapp
  name: windowswebappnamea
  namespace: upbound-system
spec:
  forProvider:
    authSettings:
      enabled: false
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: windowswebapp
    servicePlanIdSelector:
      matchLabels:
        testing.upbound.io/example-name: windowswebapp
    siteConfig: {}
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: web/v1beta1/windowswebapp
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: windowswebapp
  name: example-windowswebapp
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: web.azure.m.upbound.io/v1beta1
kind: ServicePlan
metadata:
  annotations:
    meta.upbound.io/example-id: web/v1beta2/windowswebapp
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: windowswebapp
  name: example-windowswebapp
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    osType: Windows
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: windowswebapp
    skuName: P1v2
