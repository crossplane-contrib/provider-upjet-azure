apiVersion: cdn.azure.m.upbound.io/v1beta1
kind: Endpoint
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows creating classic CDN resources since October 1, 2025. Existing ones can be managed until the service is retired on September 30, 2027."
    meta.upbound.io/example-id: cdn/v1beta2/endpoint
  labels:
    testing.upbound.io/example-name: endpointlabel
  name: endpointnm
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    origin:
      - hostName: www.contoso.com
        name: example
    profileNameSelector:
      matchLabels:
        testing.upbound.io/example-name: profilelabel-endpoint
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgroupnamelabel-endpoint
---
apiVersion: cdn.azure.m.upbound.io/v1beta1
kind: Profile
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows creating classic CDN resources since October 1, 2025. Existing ones can be managed until the service is retired on September 30, 2027."
    meta.upbound.io/example-id: cdn/v1beta2/endpoint
  labels:
    testing.upbound.io/example-name: profilelabel-endpoint
  name: profilename-endpoint
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgroupnamelabel-endpoint
    sku: Standard_Verizon
    tags:
      cost_center: MSFT
      environment: Production
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of Endpoint. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: cdn/v1beta1/endpoint
  labels:
    testing.upbound.io/example-name: rgroupnamelabel-endpoint
  name: r-group-test-name-endpoint
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
