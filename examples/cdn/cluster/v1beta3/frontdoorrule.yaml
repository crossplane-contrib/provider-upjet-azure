apiVersion: cdn.azure.upbound.io/v1beta3
kind: FrontdoorRule
metadata:
  annotations:
    uptest.upbound.io/timeout: "3600"
    meta.upbound.io/example-id: cdn/v1beta3/frontdoorrule
  labels:
    testing.upbound.io/example-name: frontdoorrule
  name: example
spec:
  forProvider:
    actions:
      routeConfigurationOverride:
        caching:
          behaviour: OverrideIfOriginMissing
          compressionEnabled: true
          duration: 365.23:59:59
          queryStringBehaviour: IncludeSpecifiedQueryStrings
          queryStringParameters:
          - foo
          - clientIp={client_ip}
        originGroup:
          cdnFrontdoorOriginGroupIdSelector:
            matchLabels:
              testing.upbound.io/example-name: frontdoorrule
          forwardingProtocol: HttpsOnly
    behaviourOnMatch: Continue
    cdnFrontdoorRuleSetIdSelector:
      matchLabels:
        testing.upbound.io/example-name: frontdoorrule
    conditions:
      deviceType:
      - operator: Equal
        values:
        - Mobile
      hostName:
      - operator: Equal
        transforms:
        - Lowercase
        - Trim
        values:
        - www.contoso.com
        - images.contoso.com
        - video.contoso.com
      postArgument:
      - name: customerName
        operator: BeginsWith
        transforms:
        - Uppercase
        values:
        - J
        - K
      requestFilename:
      - operator: Equal
        transforms:
        - Lowercase
        - RemoveNulls
        - Trim
        values:
        - media.mp4
      requestMethod:
      - operator: Equal
        values:
        - DELETE
    order: 1

---

apiVersion: cdn.azure.upbound.io/v1beta1
kind: FrontdoorEndpoint
metadata:
  annotations:
    meta.upbound.io/example-id: cdn/v1beta3/frontdoorrule
  labels:
    testing.upbound.io/example-name: frontdoorrule
  name: example
spec:
  forProvider:
    cdnFrontdoorProfileIdSelector:
      matchLabels:
        testing.upbound.io/example-name: frontdoorrule
    tags:
      endpoint: contoso.com

---

apiVersion: cdn.azure.upbound.io/v1beta2
kind: FrontdoorOrigin
metadata:
  annotations:
    meta.upbound.io/example-id: cdn/v1beta3/frontdoorrule
  labels:
    testing.upbound.io/example-name: frontdoorrule
  name: example-frontdoorrule
spec:
  forProvider:
    cdnFrontdoorOriginGroupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: frontdoorrule
    certificateNameCheckEnabled: false
    enabled: true
    hostName: contoso.com
    httpPort: 80
    httpsPort: 443
    originHostHeader: www.contoso.com
    priority: 1
    weight: 500

---

apiVersion: cdn.azure.upbound.io/v1beta2
kind: FrontdoorOriginGroup
metadata:
  annotations:
    meta.upbound.io/example-id: cdn/v1beta3/frontdoorrule
  labels:
    testing.upbound.io/example-name: frontdoorrule
  name: example-frontdoorrule
spec:
  forProvider:
    cdnFrontdoorProfileIdSelector:
      matchLabels:
        testing.upbound.io/example-name: frontdoorrule
    healthProbe:
      intervalInSeconds: 240
      path: /healthProbe
      protocol: Https
      requestType: GET
    loadBalancing:
      additionalLatencyInMilliseconds: 0
      sampleSize: 16
      successfulSamplesRequired: 3
    restoreTrafficTimeToHealedOrNewEndpointInMinutes: 10
    sessionAffinityEnabled: true

---

apiVersion: cdn.azure.upbound.io/v1beta1
kind: FrontdoorProfile
metadata:
  annotations:
    meta.upbound.io/example-id: cdn/v1beta3/frontdoorrule
  labels:
    testing.upbound.io/example-name: frontdoorrule
  name: example-frontdoorrule
spec:
  forProvider:
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgfrontdoorrule
    skuName: Standard_AzureFrontDoor

---

apiVersion: cdn.azure.upbound.io/v1beta1
kind: FrontdoorRuleSet
metadata:
  annotations:
    meta.upbound.io/example-id: cdn/v1beta3/frontdoorrule
  labels:
    testing.upbound.io/example-name: frontdoorrule
  name: example
spec:
  forProvider:
    cdnFrontdoorProfileIdSelector:
      matchLabels:
        testing.upbound.io/example-name: frontdoorrule

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: cdn/v1beta1/frontdoorrule
  labels:
    testing.upbound.io/example-name: rgfrontdoorrule
  name: rgfrontdoorrule
spec:
  forProvider:
    location: West Europe
