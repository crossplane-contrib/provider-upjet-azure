    testing.upbound.io/example-name: eventgriddataconnection
  name: kexamplea25303d7
spec:
  forProvider:
    accountReplicationType: GRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
