---

apiVersion: kusto.azure.upbound.io/v1beta3
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: kusto/v1beta2/eventgriddataconnection
  labels:
    testing.upbound.io/example-name: eventgriddataconnection
  name: kcluster
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection
    sku:
      capacity: 2
      name: Standard_D13_v2

---

apiVersion: kusto.azure.upbound.io/v1beta1
kind: Database
metadata:
  annotations:
    meta.upbound.io/example-id: kusto/v1beta2/eventgriddataconnection
  labels:
    testing.upbound.io/example-name: eventgriddataconnection
  name: example
spec:
  forProvider:
    clusterNameRef:
      name: kcluster
    hotCachePeriod: P7D
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection
    softDeletePeriod: P31D

