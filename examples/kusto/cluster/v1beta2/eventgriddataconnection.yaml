apiVersion: kusto.azure.upbound.io/v1beta2
kind: EventGridDataConnection
metadata:
  annotations:
    uptest.upbound.io/timeout: "7200"
    meta.upbound.io/example-id: kusto/v1beta2/eventgriddataconnection
  labels:
    testing.upbound.io/example-name: eventgriddataconnection
  name: example
spec:
  forProvider:
    clusterNameRef:
      name: kcluster
    dataFormat: JSON
    databaseNameSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection
    eventhubConsumerGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection
    eventhubIdSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection
    location: West Europe
    mappingRuleName: my-table-mapping
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection

---

apiVersion: eventhub.azure.upbound.io/v1beta3
kind: EventHub
metadata:
  annotations:
    meta.upbound.io/example-id: kusto/v1beta2/eventgriddataconnection
  labels:
    testing.upbound.io/example-name: eventgriddataconnection
  name: kustoexample
spec:
  forProvider:
    messageRetention: 1
    namespaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection
    partitionCount: 1

---

