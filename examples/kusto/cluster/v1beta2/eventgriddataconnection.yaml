kind: ConsumerGroup
metadata:
  annotations:
    meta.upbound.io/example-id: kusto/v1beta2/eventgriddataconnection
  labels:
    testing.upbound.io/example-name: eventgriddataconnection
  name: kexamplea25303d7
spec:
  forProvider:
    eventhubNameSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection
    namespaceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: eventgriddataconnection

---

apiVersion: eventhub.azure.upbound.io/v1beta2
kind: EventHubNamespace
metadata:
  annotations:
    meta.upbound.io/example-id: kusto/v1beta2/eventgriddataconnection
  labels:
    testing.upbound.io/example-name: eventgriddataconnection
  name: kustoexample
spec:
