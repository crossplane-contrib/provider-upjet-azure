apiVersion: insights.azure.m.upbound.io/v1beta2
kind: MonitorDiagnosticSetting
metadata:
  annotations:
    meta.upbound.io/example-id: insights/v1beta2/monitordiagnosticsetting
  labels:
    testing.upbound.io/example-name: insightsmdscd7c76d0
  name: insightsmdscd7c76d0
  namespace: upbound-system
spec:
  forProvider:
    enabledLog:
      - category: AuditEvent
    enabledMetric:
      - category: AllMetrics
    name: insightsmdscd7c76d0
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: insightsmdscd7c76d0
    targetResourceId: ${data.azurerm_client_config.current.subscription_resource_id}/resourceGroups/insightsmdscd7c76d0/providers/Microsoft.KeyVault/vaults/insightsmdscd7c76d0
---
apiVersion: keyvault.azure.m.upbound.io/v1beta2
kind: Vault
metadata:
  annotations:
    meta.upbound.io/example-id: insights/v1beta2/monitordiagnosticsetting
  labels:
    testing.upbound.io/example-name: insightsmdscd7c76d0
  name: insightsmdscd7c76d0
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    purgeProtectionEnabled: false
    rbacAuthorizationEnabled: false
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: insightsmdscd7c76d0
    skuName: standard
    softDeleteRetentionDays: 7
    tenantId: ${data.azurerm_client_config.current.tenant_id}
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: insights/v1beta2/monitordiagnosticsetting
  labels:
    testing.upbound.io/example-name: insightsmdscd7c76d0
  name: insightsmdscd7c76d0
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: storage.azure.m.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: insights/v1beta2/monitordiagnosticsetting
  labels:
    testing.upbound.io/example-name: insightsmdscd7c76d0
  name: insightsmdscd7c76d0
  namespace: upbound-system
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: insightsmdscd7c76d0
