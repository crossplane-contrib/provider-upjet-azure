apiVersion: network.azure.m.upbound.io/v1beta2
kind: PrivateDNSMXRecord
metadata:
  name: example
  namespace: upbound-system
spec:
  forProvider:
    record:
      - exchange: mx1.contoso.com
        preference: 10
      - exchange: backupmx.contoso.com
        preference: 20
    tags:
      Environment: Production
    ttl: 300
    privateDnsZoneIdRef:
      name: example
