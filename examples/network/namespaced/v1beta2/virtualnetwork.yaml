apiVersion: network.azure.m.upbound.io/v1beta2
kind: VirtualNetwork
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/virtualnetwork
  labels:
    testing.upbound.io/example-name: virtualnetwork
  name: example-virtualnetwork
  namespace: upbound-system
spec:
  forProvider:
    addressSpace:
    - 10.0.0.0/16
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: virtualnetwork
    tags:
      environment: Production

---

apiVersion: network.azure.m.upbound.io/v1beta1
kind: SecurityGroup
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/virtualnetwork
  labels:
    testing.upbound.io/example-name: virtualnetwork
  name: example-virtualnetwork
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: virtualnetwork

---

apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/virtualnetwork
  labels:
    testing.upbound.io/example-name: virtualnetwork
  name: example-virtualnetwork
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
