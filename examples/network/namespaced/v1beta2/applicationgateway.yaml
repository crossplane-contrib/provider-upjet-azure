apiVersion: network.azure.m.upbound.io/v1beta2
kind: ApplicationGateway
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/applicationgateway
    uptest.upbound.io/timeout: "7200"
  labels:
    testing.upbound.io/example-name: network
  name: example
  namespace: upbound-system
spec:
  forProvider:
    backendAddressPool:
      - name: example
    backendHttpSettings:
      - cookieBasedAffinity: Disabled
        name: example
        path: /path1/
        port: 80
        protocol: Http
        requestTimeout: 60
    frontendIpConfiguration:
      - name: example
        publicIpAddressIdSelector:
          matchLabels:
            testing.upbound.io/example-name: applicationgateway
    frontendPort:
      - name: example
        port: 80
    gatewayIpConfiguration:
      - name: my-gateway-ip-configuration
        subnetIdSelector:
          matchLabels:
            testing.upbound.io/example-name: frontend
    httpListener:
      - frontendIpConfigurationName: example
        frontendPortName: example
        name: example
        protocol: Http
    location: West Europe
    requestRoutingRule:
      - backendAddressPoolName: example
        backendHttpSettingsName: example
        httpListenerName: example
        name: example
        priority: 9
        ruleType: Basic
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: applicationgateway
    sku:
      capacity: 2
      name: Standard_v2
      tier: Standard_v2
---
apiVersion: network.azure.m.upbound.io/v1beta1
kind: PublicIP
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/applicationgateway
  labels:
    testing.upbound.io/example-name: applicationgateway
  name: example-applicationgateway
  namespace: upbound-system
spec:
  forProvider:
    allocationMethod: Static
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: applicationgateway
    sku: Standard
---
apiVersion: network.azure.m.upbound.io/v1beta2
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/applicationgateway
  labels:
    testing.upbound.io/example-name: backend
  name: backend
  namespace: upbound-system
spec:
  forProvider:
    addressPrefixes:
      - 10.254.2.0/24
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: applicationgateway
    virtualNetworkNameSelector:
      matchLabels:
        testing.upbound.io/example-name: applicationgateway
---
apiVersion: network.azure.m.upbound.io/v1beta2
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/applicationgateway
  labels:
    testing.upbound.io/example-name: frontend
  name: frontend
  namespace: upbound-system
spec:
  forProvider:
    addressPrefixes:
      - 10.254.0.0/24
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: applicationgateway
    virtualNetworkNameSelector:
      matchLabels:
        testing.upbound.io/example-name: applicationgateway
---
apiVersion: network.azure.m.upbound.io/v1beta2
kind: VirtualNetwork
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/applicationgateway
  labels:
    testing.upbound.io/example-name: applicationgateway
  name: example-applicationgateway
  namespace: upbound-system
spec:
  forProvider:
    addressSpace:
      - 10.254.0.0/16
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: applicationgateway
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta2/applicationgateway
  labels:
    testing.upbound.io/example-name: applicationgateway
  name: example-applicationgateway
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
