apiVersion: network.azure.upbound.io/v1beta3
kind: WatcherFlowLog
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta3/watcherflowlog
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-watcherflowlog.sh
  name: example
spec:
  forProvider:
    enabled: true
    targetResourceIdRef:
      name: example-watcherflowlog-vnet
    networkWatcherNameRef:
      name: poland-watcher
    resourceGroupNameRef:
      name: poland-watcher-rg
    retentionPolicy:
      days: 7
      enabled: true
    storageAccountIdRef:
      name: saflow9da7affb

---

apiVersion: network.azure.upbound.io/v1beta1
kind: Watcher
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta3/watcherflowlog
  name: poland-watcher
spec:
  forProvider:
    location: Poland Central
    resourceGroupNameRef:
      name: poland-watcher-rg

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  name: poland-watcher-rg
spec:
  forProvider:
    location: Poland Central
    tags:
      provisioner: crossplane

---

apiVersion: network.azure.upbound.io/v1beta3
kind: VirtualNetwork
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta3/watcherflowlog
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-watcherflowlog.sh
  name: example-watcherflowlog-vnet
spec:
  forProvider:
    addressSpace:
      - 10.0.0.0/16
    location: Poland Central
    resourceGroupNameRef:
      name: poland-watcher-rg
    tags:
      environment: Production

---

apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1beta3/watcherflowlog
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-watcherflowlog.sh
  name: saflow9da7affb
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: Poland Central
    resourceGroupNameRef:
      name: poland-watcher-rg
    tags:
      provisioner: crossplane
  writeConnectionSecretToRef:
    name: example-storage-account-watcherflowlog
    namespace: upbound-system
