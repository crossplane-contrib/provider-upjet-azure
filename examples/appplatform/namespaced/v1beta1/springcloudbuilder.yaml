apiVersion: appplatform.azure.m.upbound.io/v1beta1
kind: SpringCloudBuilder
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudbuilder
    uptest.upbound.io/timeout: "7200"
  labels:
    testing.upbound.io/example-name: example
  name: scbexample
  namespace: upbound-system
spec:
  forProvider:
    buildPackGroup:
      - buildPackIds:
          - tanzu-buildpacks/java-azure
        name: mix
    name: scbexample
    springCloudServiceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    stack:
      id: io.buildpacks.stacks.bionic
      version: base
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudBuilder. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: appplatform/v1beta1/springcloudbuilder
  labels:
    testing.upbound.io/example-name: example
  name: scbexample
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: appplatform.azure.m.upbound.io/v1beta1
kind: SpringCloudService
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudbuilder
  labels:
    testing.upbound.io/example-name: example
  name: scbexample
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    skuName: E0
