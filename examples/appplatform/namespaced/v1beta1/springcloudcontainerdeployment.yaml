apiVersion: appplatform.azure.m.upbound.io/v1beta1
kind: SpringCloudContainerDeployment
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudcontainerdeployment
    uptest.upbound.io/timeout: "7200"
  labels:
    testing.upbound.io/example-name: example
  name: sccdexample
  namespace: upbound-system
spec:
  forProvider:
    arguments:
      - -cp
      - /app/resources:/app/classes:/app/libs/*
      - hello.Application
    commands:
      - java
    environmentVariables:
      Env: Staging
      Foo: Bar
    image: springio/gs-spring-boot-docker
    instanceCount: 2
    languageFramework: springboot
    server: docker.io
    springCloudAppIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudContainerDeployment. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: appplatform/v1beta1/springcloudcontainerdeployment
  labels:
    testing.upbound.io/example-name: example
  name: sccdexample
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: appplatform.azure.m.upbound.io/v1beta1
kind: SpringCloudApp
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudcontainerdeployment
  labels:
    testing.upbound.io/example-name: example
  name: sccdexample
  namespace: upbound-system
spec:
  forProvider:
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    serviceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
---
apiVersion: appplatform.azure.m.upbound.io/v1beta1
kind: SpringCloudService
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudcontainerdeployment
  labels:
    testing.upbound.io/example-name: example
  name: sccdexample
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    skuName: E0
