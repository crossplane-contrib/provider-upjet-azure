apiVersion: appplatform.azure.m.upbound.io/v1beta1
kind: SpringCloudStorage
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta1/springcloudstorage
  labels:
    testing.upbound.io/example-name: example
  name: example-storage
  namespace: upbound-system
spec:
  forProvider:
    springCloudServiceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    storageAccountKey: key1
    storageAccountNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudStorage. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: appplatform/v1beta1/springcloudstorage
  labels:
    testing.upbound.io/example-name: example
  name: spring-group
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: appplatform.azure.m.upbound.io/v1beta1
kind: SpringCloudService
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta1/springcloudstorage
  labels:
    testing.upbound.io/example-name: example
  name: example-service
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
---
apiVersion: storage.azure.m.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudStorage. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: appplatform/v1beta1/springcloudstorage
  labels:
    testing.upbound.io/example-name: example
  name: exampleac
  namespace: upbound-system
spec:
  forProvider:
    accountReplicationType: GRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
