apiVersion: appplatform.azure.upbound.io/v1beta2
kind: SpringCloudApp
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudapp
  labels:
    testing.upbound.io/example-name: example
  name: example-app
spec:
  forProvider:
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    serviceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudApp. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: appplatform/v1beta1/springcloudapp
  labels:
    testing.upbound.io/example-name: example
  name: example-group
spec:
  forProvider:
    location: West Europe

---

apiVersion: appplatform.azure.upbound.io/v1beta2
kind: SpringCloudService
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudapp
  labels:
    testing.upbound.io/example-name: example
  name: example-service
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
