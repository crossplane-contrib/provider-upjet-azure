apiVersion: appplatform.azure.upbound.io/v1beta2
kind: SpringCloudBuildPackBinding
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudbuildpackbinding
    uptest.upbound.io/timeout: "7200"
  labels:
    testing.upbound.io/example-name: example
  name: scbpbexample
spec:
  forProvider:
    bindingType: ApplicationInsights
    springCloudBuilderIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudBuildPackBinding. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: appplatform/v1beta1/springcloudbuildpackbinding
  labels:
    testing.upbound.io/example-name: example
  name: scbpbexample
spec:
  forProvider:
    location: West Europe

---

apiVersion: appplatform.azure.upbound.io/v1beta2
kind: SpringCloudBuilder
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudbuildpackbinding
  labels:
    testing.upbound.io/example-name: example
  name: scbpbexample
spec:
  forProvider:
    buildPackGroup:
    - buildPackIds:
      - tanzu-buildpacks/java-azure
      name: mix
    name: example
    springCloudServiceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    stack:
      id: io.buildpacks.stacks.bionic
      version: base

---

apiVersion: appplatform.azure.upbound.io/v1beta2
kind: SpringCloudService
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: appplatform/v1beta2/springcloudbuildpackbinding
  labels:
    testing.upbound.io/example-name: example
  name: scbpbexample
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    skuName: E0
