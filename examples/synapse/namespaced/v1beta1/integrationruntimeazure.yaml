apiVersion: synapse.azure.m.upbound.io/v1beta1
kind: IntegrationRuntimeAzure
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: integrationruntime-label
  name: integrationruntime
  namespace: upbound-system
spec:
  forProvider:
    location: South Africa North
    synapseWorkspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: integration-ws-label-integrationruntimeazure
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: integration-rg-label-integrationruntimeazure
  name: integration-rg-integrationruntimeazure
  namespace: upbound-system
spec:
  forProvider:
    location: South Africa North
---
apiVersion: storage.azure.m.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: account-label-integrationruntimeazure
  name: integruntimeaca54f898a
  namespace: upbound-system
spec:
  forProvider:
    accountKind: StorageV2
    accountReplicationType: LRS
    accountTier: Standard
    isHnsEnabled: true
    location: South Africa North
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: integration-rg-label-integrationruntimeazure
---
apiVersion: storage.azure.m.upbound.io/v1beta1
kind: DataLakeGen2FileSystem
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: file-system-label-integrationruntimeazure
  name: file-system-integrationruntimeazure
  namespace: upbound-system
spec:
  forProvider:
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: account-label-integrationruntimeazure
---
apiVersion: synapse.azure.m.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: integration-ws-label-integrationruntimeazure
  name: integrationws768498bc
  namespace: upbound-system
spec:
  forProvider:
    identity:
      type: SystemAssigned
    location: South Africa North
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: integration-rg-label-integrationruntimeazure
    sqlAdministratorLogin: sqladminuser
    storageDataLakeGen2FilesystemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: file-system-label-integrationruntimeazure
