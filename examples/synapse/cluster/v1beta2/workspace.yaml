apiVersion: synapse.azure.upbound.io/v1beta2
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta2/workspace
  labels:
    testing.upbound.io/example-name: synapse-workspace
  name: synapse-workspace-123-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    identity:
      type: SystemAssigned
    location: UK South
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: synapse-resource-group-label
    sqlAdministratorLogin: sqladminuser
    storageDataLakeGen2FilesystemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: file-system-label-synapse-workspace

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/workspace
  labels:
    testing.upbound.io/example-name: synapse-resource-group-label
  name: synapse-resource-group
spec:
  forProvider:
    location: UK South

---

apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta2/workspace
  labels:
    testing.upbound.io/example-name: account-label-synapse-workspace
  name: synapseaccount4ad8aa7c
spec:
  forProvider:
    accountKind: StorageV2
    accountReplicationType: LRS
    accountTier: Standard
    isHnsEnabled: true
    location: UK South
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: synapse-resource-group-label

---

apiVersion: storage.azure.upbound.io/v1beta1
kind: DataLakeGen2FileSystem
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta2/workspace
  labels:
    testing.upbound.io/example-name: file-system-label-synapse-workspace
  name: file-system-synapse-workspace
spec:
  forProvider:
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: account-label-synapse-workspace
