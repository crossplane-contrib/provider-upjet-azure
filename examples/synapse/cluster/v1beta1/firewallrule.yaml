apiVersion: synapse.azure.upbound.io/v1beta1
kind: FirewallRule
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: firewallrule
  name: firewallrule
spec:
  forProvider:
    endIpAddress: 255.255.255.255
    startIpAddress: 0.0.0.0
    synapseWorkspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: firewall-ws-label

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: firewall-rg-label
  name: firewall-rg
spec:
  forProvider:
    location: Sweden Central

---

apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: account-label-firewallrule
  name: firewallaccounc53f15f7
spec:
  forProvider:
    accountKind: StorageV2
    accountReplicationType: LRS
    accountTier: Standard
    isHnsEnabled: true
    location: Sweden Central
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: firewall-rg-label

---

apiVersion: storage.azure.upbound.io/v1beta1
kind: DataLakeGen2FileSystem
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: file-system-label-firewallrule
  name: file-system-firewallrule
spec:
  forProvider:
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: account-label-firewallrule

---

apiVersion: synapse.azure.upbound.io/v1beta2
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeazure
  labels:
    testing.upbound.io/example-name: firewall-ws-label
  name: firewall-ws-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    identity:
      type: SystemAssigned
    location: Sweden Central
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: firewall-rg-label
    sqlAdministratorLogin: sqladminuser
    storageDataLakeGen2FilesystemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: file-system-label-firewallrule
