apiVersion: synapse.azure.upbound.io/v1beta1
kind: IntegrationRuntimeSelfHosted
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeselfhosted
  labels:
    testing.upbound.io/example-name: synapse-integrationruntimeselfhosted
  name: integrationruntimeselfhosted
spec:
  forProvider:
    synapseWorkspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: integration-ws-label-synapse-integrationruntimeselfhosted

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeselfhosted
  labels:
    testing.upbound.io/example-name: integration-rg-label-synapse-integrationruntimeselfhosted
  name: integration-rg-synapse-integrationruntimeselfhosted
spec:
  forProvider:
    location: UAE North

---

apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeselfhosted
  labels:
    testing.upbound.io/example-name: account-label-synapse-integrationruntimeselfhosted
  name: integruntimeac401ab39b
spec:
  forProvider:
    accountKind: StorageV2
    accountReplicationType: LRS
    accountTier: Standard
    isHnsEnabled: true
    location: UAE North
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: integration-rg-label-synapse-integrationruntimeselfhosted

---

apiVersion: storage.azure.upbound.io/v1beta1
kind: DataLakeGen2FileSystem
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeselfhosted
  labels:
    testing.upbound.io/example-name: file-system-label-synapse-integrationruntimeselfhosted
  name: file-system-synapse-integrationruntimeselfhosted
spec:
  forProvider:
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: account-label-synapse-integrationruntimeselfhosted

---

apiVersion: synapse.azure.upbound.io/v1beta2
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: synapse/v1beta1/integrationruntimeselfhosted
  labels:
    testing.upbound.io/example-name: integration-ws-label-synapse-integrationruntimeselfhosted
  name: integrationws3535ca87
spec:
  forProvider:
    identity:
      type: SystemAssigned
    location: UAE North
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: integration-rg-label-synapse-integrationruntimeselfhosted
    sqlAdministratorLogin: sqladminuser
    storageDataLakeGen2FilesystemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: file-system-label-synapse-integrationruntimeselfhosted
