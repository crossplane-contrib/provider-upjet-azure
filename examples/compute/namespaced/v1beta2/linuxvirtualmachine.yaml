apiVersion: compute.azure.m.upbound.io/v1beta2
kind: LinuxVirtualMachine
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta2/linuxvirtualmachine
  labels:
    testing.upbound.io/example-name: linuxvirtualmachine
  name: example
  namespace: upbound-system
spec:
  forProvider:
    adminSshKey:
      - publicKey: ssh-rsa  you@me.com
        username: adminuser
    adminUsername: adminuser
    location: West Europe
    networkInterfaceIdsRefs:
      - name: example-linuxvirtualmachine
    osDisk:
      caching: ReadWrite
      storageAccountType: Standard_LRS
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: linuxvirtualmachine
    size: Standard_F2
    sourceImageReference:
      offer: UbuntuServer
      publisher: Canonical
      sku: 16.04-LTS
      version: latest
---
apiVersion: network.azure.m.upbound.io/v1beta1
kind: NetworkInterface
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta2/linuxvirtualmachine
  labels:
    testing.upbound.io/example-name: linuxvirtualmachine
  name: example-linuxvirtualmachine
  namespace: upbound-system
spec:
  forProvider:
    ipConfiguration:
      - name: internal
        privateIpAddressAllocation: Dynamic
        subnetIdSelector:
          matchLabels:
            testing.upbound.io/example-name: linuxvirtualmachine
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: linuxvirtualmachine
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta2/linuxvirtualmachine
  labels:
    testing.upbound.io/example-name: linuxvirtualmachine
  name: example-linuxvirtualmachine
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: network.azure.m.upbound.io/v1beta2
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta2/linuxvirtualmachine
  labels:
    testing.upbound.io/example-name: linuxvirtualmachine
  name: example-linuxvirtualmachine
  namespace: upbound-system
spec:
  forProvider:
    addressPrefixes:
      - 10.0.2.0/24
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: linuxvirtualmachine
    virtualNetworkNameSelector:
      matchLabels:
        testing.upbound.io/example-name: linuxvirtualmachine
---
apiVersion: network.azure.m.upbound.io/v1beta2
kind: VirtualNetwork
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta2/linuxvirtualmachine
  labels:
    testing.upbound.io/example-name: linuxvirtualmachine
  name: example-linuxvirtualmachine
  namespace: upbound-system
spec:
  forProvider:
    addressSpace:
      - 10.0.0.0/16
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: linuxvirtualmachine
