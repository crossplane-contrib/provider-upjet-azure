apiVersion: datafactory.azure.upbound.io/v1beta2
kind: Pipeline
metadata:
  annotations:
    meta.upbound.io/example-id: datafactory/v1beta2/pipeline
  labels:
    testing.upbound.io/example-name: pipeline
  name: dfpexample
spec:
  forProvider:
    dataFactoryIdSelector:
      matchLabels:
        testing.upbound.io/example-name: pipeline

---

apiVersion: datafactory.azure.upbound.io/v1beta2
kind: Factory
metadata:
  annotations:
    meta.upbound.io/example-id: datafactory/v1beta2/pipeline
  labels:
    testing.upbound.io/example-name: pipeline
  name: dfpexample
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: pipeline

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: datafactory/v1beta2/pipeline
  labels:
    testing.upbound.io/example-name: pipeline
  name: dfpexample
spec:
  forProvider:
    location: West Europe
