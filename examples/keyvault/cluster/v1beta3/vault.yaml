apiVersion: keyvault.azure.upbound.io/v1beta3
kind: Vault
metadata:
  annotations:
    meta.upbound.io/example-id: keyvault/v1beta3/vault
  labels:
    testing.upbound.io/example-name: keyvault-vault
  name: uptest-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    enabledForDiskEncryption: true
    location: West Europe
    purgeProtectionEnabled: false
    rbacAuthorizationEnabled: false
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: keyvault-vault
    skuName: standard
    softDeleteRetentionDays: 7
    tenantId: ${data.azurerm_client_config.current.tenant_id}

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: keyvault/v1beta1/vault
  labels:
    testing.upbound.io/example-name: keyvault-vault
  name: uptest-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    location: West Europe
