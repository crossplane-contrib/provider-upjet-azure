apiVersion: sql.azure.m.upbound.io/v1beta2
kind: MSSQLDatabaseExtendedAuditingPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: sql/v1beta2/mssqldatabaseextendedauditingpolicy
  labels:
    testing.upbound.io/example-name: mssqldatabaseextendedauditingpolicy
  name: auditingpolicyname
  namespace: upbound-system
spec:
  forProvider:
    databaseIdSelector:
      matchLabels:
        testing.upbound.io/example-name: mssqldatabaseextendedauditingpolicy
    retentionInDays: 0
---
apiVersion: sql.azure.m.upbound.io/v1beta2
kind: MSSQLDatabase
metadata:
  annotations:
    meta.upbound.io/example-id: sql/v1beta2/mssqldatabaseextendedauditingpolicy
  labels:
    testing.upbound.io/example-name: mssqldatabaseextendedauditingpolicy
  name: database
  namespace: upbound-system
spec:
  forProvider:
    serverIdSelector:
      matchLabels:
        testing.upbound.io/example-name: mssqldatabaseextendedauditingpolicy
---
apiVersion: sql.azure.m.upbound.io/v1beta1
kind: MSSQLServer
metadata:
  annotations:
    meta.upbound.io/example-id: sql/v1beta2/mssqldatabaseextendedauditingpolicy
  labels:
    testing.upbound.io/example-name: mssqldatabaseextendedauditingpolicy
  name: mssqlservername-mssqldatabaseextendedauditingpolicy
  namespace: upbound-system
spec:
  forProvider:
    administratorLogin: missadministrator
    administratorLoginPasswordSecretRef:
      key: example-key
      name: example-secret-mssqldatabaseextendedauditingpolicy
    location: Sweden Central
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: mssqldatabaseextendedauditingpolicy
    version: "12.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: example-secret-mssqldatabaseextendedauditingpolicy
  namespace: upbound-system
type: Opaque
data:
  example-key: dGVzdFBhc3N3b3JkITEyMw==
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: sql/v1beta2/mssqldatabaseextendedauditingpolicy
  labels:
    testing.upbound.io/example-name: mssqldatabaseextendedauditingpolicy
  name: policy-rg-mssqldatabaseextendedauditingpolicy
  namespace: upbound-system
spec:
  forProvider:
    location: Sweden Central
