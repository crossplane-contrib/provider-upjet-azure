apiVersion: sql.azure.upbound.io/v1beta2
kind: MSSQLDatabaseExtendedAuditingPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: sql/v1beta2/mssqldatabaseextendedauditingpolicy
  labels:
    testing.upbound.io/example-name: sql-mssqldatabaseextendedauditingpolicy
  name: auditingpolicyname-sql-mssqldatabaseextendedauditingpolicy
spec:
  forProvider:
    databaseIdSelector:
      matchLabels:
        testing.upbound.io/example-name: sql-mssqldatabaseextendedauditingpolicy
    retentionInDays: 0

---

apiVersion: sql.azure.upbound.io/v1beta3
kind: MSSQLDatabase
metadata:
  annotations:
    meta.upbound.io/example-id: sql/v1beta2/mssqldatabaseextendedauditingpolicy
  labels:
    testing.upbound.io/example-name: sql-mssqldatabaseextendedauditingpolicy
  name: database-sql-mssqldatabaseextendedauditingpolicy
spec:
  forProvider:
    serverIdSelector:
      matchLabels:
        testing.upbound.io/example-name: sql-mssqldatabaseextendedauditingpolicy

---

apiVersion: sql.azure.upbound.io/v1beta2
kind: MSSQLServer
metadata:
  annotations:
    meta.upbound.io/example-id: sql/v1beta2/mssqldatabaseextendedauditingpolicy
  labels:
    testing.upbound.io/example-name: sql-mssqldatabaseextendedauditingpolicy
  name: mssqlservername-sql-mssqldatabaseextendedauditingpolicy
spec:
  forProvider:
    administratorLogin: missadministrator
    administratorLoginPasswordSecretRef:
      key: example-key
      name: example-secret-sql-mssqldatabaseextendedauditingpolicy
      namespace: upbound-system
    location: Sweden Central
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: sql-mssqldatabaseextendedauditingpolicy
    version: "12.0"

---

apiVersion: v1
kind: Secret
metadata:
  name: example-secret-sql-mssqldatabaseextendedauditingpolicy
  namespace: upbound-system
type: Opaque
data:
  example-key: dGVzdFBhc3N3b3JkITEyMw==

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: sql/v1beta2/mssqldatabaseextendedauditingpolicy
  labels:
    testing.upbound.io/example-name: sql-mssqldatabaseextendedauditingpolicy
  name: policy-rg-sql-mssqldatabaseextendedauditingpolicy
spec:
  forProvider:
    location: Sweden Central
