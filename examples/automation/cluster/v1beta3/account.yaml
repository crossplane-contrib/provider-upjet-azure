apiVersion: automation.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: automation/v1beta3/account
  labels:
    testing.upbound.io/example-name: automation-account
  name: example
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: automation-account
    skuName: Basic
    tags:
      environment: development

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: automation/v1beta1/account
  labels:
    testing.upbound.io/example-name: automation-account
  name: example-automation-account
spec:
  forProvider:
    location: West Europe
