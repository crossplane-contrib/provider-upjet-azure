apiVersion: operationalinsights.azure.upbound.io/v1beta2
kind: LogAnalyticsLinkedStorageAccount
metadata:
  annotations:
    uptest.upbound.io/timeout: "3600"
    meta.upbound.io/example-id: operationalinsights/v1beta2/loganalyticslinkedstorageaccount
  labels:
    testing.upbound.io/example-name: loganalyticslinkedstorageaccount
  name: example
spec:
  forProvider:
    dataSourceType: CustomLogs
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rg-operationalinsights
    storageAccountIdsRefs:
    - name: sampleacc36d4c48b
    workspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: loganalyticslinkedstorageaccount
---
apiVersion: operationalinsights.azure.upbound.io/v1beta3
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: operationalinsights/v1beta2/loganalyticslinkedstorageaccount
  labels:
    testing.upbound.io/example-name: loganalyticslinkedstorageaccount
  name: example-loganalyticslinkedstorageaccount
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rg-operationalinsights
    sku: PerGB2018
---
apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: operationalinsights/v1beta2/loganalyticslinkedstorageaccount
  labels:
    testing.upbound.io/example-name: rg-operationalinsights
  name: rg-operationalinsights
spec:
  forProvider:
    location: West Europe
---
apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: operationalinsights/v1beta2/loganalyticslinkedstorageaccount
  labels:
    testing.upbound.io/example-name: sampleacc36d4c48b
  name: sampleacc36d4c48b
spec:
  forProvider:
    accountReplicationType: GRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rg-operationalinsights
