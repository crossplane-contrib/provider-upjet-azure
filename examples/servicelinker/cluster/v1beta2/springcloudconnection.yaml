apiVersion: servicelinker.azure.upbound.io/v1beta2
kind: SpringCloudConnection
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: servicelinker/v1beta2/springcloudconnection
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: springcloudconnection
  name: example
spec:
  forProvider:
    authentication:
      type: systemAssignedIdentity
    name: example_serviceconnector
    springCloudIdSelector:
      matchLabels:
        testing.upbound.io/example-name: springcloudconnection
    targetResourceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: springcloudconnection

---

apiVersion: cosmosdb.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudConnection. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: servicelinker/v1beta2/springcloudconnection
  labels:
    testing.upbound.io/example-name: springcloudconnection
  name: default-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    consistencyPolicy:
      consistencyLevel: BoundedStaleness
      maxIntervalInSeconds: 10
      maxStalenessPrefix: 200
    geoLocation:
    - failoverPriority: 0
      location: West Europe
    kind: GlobalDocumentDB
    location: West Europe
    offerType: Standard
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgspringcloudconnection

---

apiVersion: cosmosdb.azure.upbound.io/v1beta2
kind: SQLContainer
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudConnection. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: servicelinker/v1beta2/springcloudconnection
  labels:
    testing.upbound.io/example-name: springcloudconnection
  name: default
spec:
  forProvider:
    accountNameSelector:
      matchLabels:
        testing.upbound.io/example-name: springcloudconnection
    databaseNameSelector:
      matchLabels:
        testing.upbound.io/example-name: springcloudconnection
    partitionKeyPaths:
      - /definition
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgspringcloudconnection

---

apiVersion: cosmosdb.azure.upbound.io/v1beta2
kind: SQLDatabase
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudConnection. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: servicelinker/v1beta2/springcloudconnection
  labels:
    testing.upbound.io/example-name: springcloudconnection
  name: default
spec:
  forProvider:
    accountNameSelector:
      matchLabels:
        testing.upbound.io/example-name: springcloudconnection
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgspringcloudconnection
    throughput: 400

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "This resource is a dependency of SpringCloudConnection. It is skipped because the parent resource is skipped."
    meta.upbound.io/example-id: servicelinker/v1beta1/springcloudconnection
  labels:
    testing.upbound.io/example-name: rgspringcloudconnection
  name: rgspringcloudconnection
spec:
  forProvider:
    location: West Europe

---

apiVersion: appplatform.azure.upbound.io/v1beta2
kind: SpringCloudApp
metadata:
  annotations:
    upjet.upbound.io/manual-intervention: "Azure no longer allows new customers to create Azure Spring Apps service instances. The service is being retired, see https://aka.ms/asaretirement."
    meta.upbound.io/example-id: servicelinker/v1beta2/springcloudconnection
  labels:
    testing.upbound.io/example-name: springcloudconnection
  name: default
spec:
  forProvider:
    identity:
      type: SystemAssigned
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgspringcloudconnection
    serviceNameSelector:
      matchLabels:
        testing.upbound.io/example-name: springcloudconnection

---

