apiVersion: hdinsight.azure.m.upbound.io/v1beta2
kind: HBaseCluster
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/hbasecluster
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: hbasecluster001
  name: hbasecluster001
  namespace: upbound-system
spec:
  forProvider:
    clusterVersion: "4.0"
    componentVersion:
      hbase: "2.1"
    gateway:
      passwordSecretRef:
        key: example-key
        name: example-secret-hbasecluster
      username: acctestusrgw
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rghbasecluster
    roles:
      headNode:
        passwordSecretRef:
          key: example-key
          name: example-secret-hbasecluster
        username: acctestusrvm
        vmSize: Standard_D3_V2
      workerNode:
        passwordSecretRef:
          key: example-key
          name: example-secret-hbasecluster
        targetInstanceCount: 3
        username: acctestusrvm
        vmSize: Standard_D3_V2
      zookeeperNode:
        passwordSecretRef:
          key: example-key
          name: example-secret-hbasecluster
        username: acctestusrvm
        vmSize: Standard_D3_V2
    storageAccount:
      - isDefault: true
        storageAccountKeySecretRef:
          key: attribute.primary_access_key
          name: example-storage-account-hbasecluster
        storageContainerUrlSelector:
          matchLabels:
            testing.upbound.io/example-name: hbasecluster
    tier: Standard
    tlsMinVersion: "1.2"
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/hbasecluster
  labels:
    testing.upbound.io/example-name: rghbasecluster
  name: rghbasecluster
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: storage.azure.m.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/hbasecluster
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-hbasecluster.sh
  labels:
    testing.upbound.io/example-name: example0001-hbasecluster
  name: exampledebe4615
  namespace: upbound-system
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rghbasecluster
  writeConnectionSecretToRef:
    name: example-storage-account-hbasecluster
---
apiVersion: storage.azure.m.upbound.io/v1beta2
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/hbasecluster
  labels:
    testing.upbound.io/example-name: hbasecluster
  name: example-hbasecluster
  namespace: upbound-system
spec:
  forProvider:
    containerAccessType: private
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example0001-hbasecluster
---
apiVersion: v1
data:
  example-key: VGVyckFmb3JtMTIzIQ==
kind: Secret
metadata:
  name: example-secret-hbasecluster
  namespace: upbound-system
type: Opaque
