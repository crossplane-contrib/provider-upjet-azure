apiVersion: hdinsight.azure.m.upbound.io/v1beta2
kind: HadoopCluster
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/hadoopcluster
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: example001
  name: example001
  namespace: upbound-system
spec:
  forProvider:
    clusterVersion: "4.0"
    componentVersion:
      hadoop: "3.1"
    gateway:
      passwordSecretRef:
        key: example-key
        name: example-secret-hadoopcluster
      username: acctestusrgw
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rghadoopcluster
    roles:
      headNode:
        passwordSecretRef:
          key: example-key
          name: example-secret-hadoopcluster
        username: acctestusrvm
        vmSize: Standard_D3_V2
      workerNode:
        passwordSecretRef:
          key: example-key
          name: example-secret-hadoopcluster
        targetInstanceCount: 3
        username: acctestusrvm
        vmSize: Standard_D4_V2
      zookeeperNode:
        passwordSecretRef:
          key: example-key
          name: example-secret-hadoopcluster
        username: acctestusrvm
        vmSize: Standard_D3_V2
    storageAccount:
      - isDefault: true
        storageAccountKeySecretRef:
          key: attribute.primary_access_key
          name: example-storage-account-hadoopcluster
        storageContainerUrlSelector:
          matchLabels:
            testing.upbound.io/example-name: hadoopcluster
    tier: Standard
    tlsMinVersion: "1.2"
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/hadoopcluster
  labels:
    testing.upbound.io/example-name: rghadoopcluster
  name: rghadoopcluster
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: storage.azure.m.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/hadoopcluster
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-hadoopcluster.sh
  labels:
    testing.upbound.io/example-name: example0001-hadoopcluster
  name: exampleb83a6571
  namespace: upbound-system
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rghadoopcluster
  writeConnectionSecretToRef:
    name: example-storage-account-hadoopcluster
---
apiVersion: storage.azure.m.upbound.io/v1beta2
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/hadoopcluster
  labels:
    testing.upbound.io/example-name: hadoopcluster
  name: example-hadoopcluster
  namespace: upbound-system
spec:
  forProvider:
    containerAccessType: private
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example0001-hadoopcluster
---
apiVersion: v1
data:
  example-key: VGVyckFmb3JtMTIzIQ==
kind: Secret
metadata:
  name: example-secret-hadoopcluster
  namespace: upbound-system
type: Opaque
