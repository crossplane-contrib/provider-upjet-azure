apiVersion: hdinsight.azure.m.upbound.io/v1beta2
kind: KafkaCluster
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/kafkacluster
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: kafkacluster0001
  name: kafkacluster0001
  namespace: upbound-system
spec:
  forProvider:
    clusterVersion: "4.0"
    componentVersion:
      kafka: "2.1"
    gateway:
      passwordSecretRef:
        key: example-key
        name: example-secret-kafkacluster
      username: acctestusrgw
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgkafkacluster
    roles:
      headNode:
        passwordSecretRef:
          key: example-key
          name: example-secret-kafkacluster
        username: acctestusrvm
        vmSize: Standard_D3_V2
      workerNode:
        numberOfDisksPerNode: 1
        passwordSecretRef:
          key: example-key
          name: example-secret-kafkacluster
        targetInstanceCount: 3
        username: acctestusrvm
        vmSize: Standard_D3_V2
      zookeeperNode:
        passwordSecretRef:
          key: example-key
          name: example-secret-kafkacluster
        username: acctestusrvm
        vmSize: Standard_D3_V2
    storageAccount:
      - isDefault: true
        storageAccountKeySecretRef:
          key: attribute.primary_access_key
          name: example-storage-account-kafkacluster
        storageContainerUrlSelector:
          matchLabels:
            testing.upbound.io/example-name: kafkacluster
    tier: Standard
    tlsMinVersion: "1.2"
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/kafkacluster
  labels:
    testing.upbound.io/example-name: rgkafkacluster
  name: rgkafkacluster
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
---
apiVersion: storage.azure.m.upbound.io/v1beta2
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/kafkacluster
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-kafka.sh
  labels:
    testing.upbound.io/example-name: example0001-kafkacluster
  name: example67aa2426
  namespace: upbound-system
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: rgkafkacluster
  writeConnectionSecretToRef:
    name: example-storage-account-kafkacluster
---
apiVersion: storage.azure.m.upbound.io/v1beta2
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: hdinsight/v1beta2/kafkacluster
  labels:
    testing.upbound.io/example-name: kafkacluster
  name: example-kafkacluster
  namespace: upbound-system
spec:
  forProvider:
    containerAccessType: private
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example0001-kafkacluster
---
apiVersion: v1
data:
  example-key: VGVyckFmb3JtMTIzIQ==
kind: Secret
metadata:
  name: example-secret-kafkacluster
  namespace: upbound-system
type: Opaque
