apiVersion: containerservice.azure.upbound.io/v1beta2
kind: KubernetesCluster
metadata:
  annotations:
    meta.upbound.io/example-id: containerservice/v1beta2/kubernetescluster
    testing.upbound.io/example-name: kubernetescluster-no-max-surge
  name: aksnomaxsurge
spec:
  forProvider:
    apiServerAccessProfile:
      authorizedIpRanges:
      - 192.168.1.0/24
    defaultNodePool:
      name: default
      nodeCount: 1
      vmSize: Standard_D2_v2
    dnsPrefix: aksnomaxsurge
    identity:
      type: SystemAssigned
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: kubernetescluster-no-max-surge

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  labels:
    testing.upbound.io/example-name: kubernetescluster-no-max-surge
  name: aks-no-max-surge-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    location: West Europe
