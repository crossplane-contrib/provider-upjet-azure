apiVersion: storage.azure.upbound.io/v1beta2
kind: Blob
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta2/blob
  labels:
    testing.upbound.io/example-name: blob
  name: example
spec:
  forProvider:
    sourceContent: inline content for this blob
    storageContainerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: blob
    type: Block

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta2/blob
  labels:
    testing.upbound.io/example-name: example-storage-blob
  name: example-storage-blob-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    location: West Europe

---

apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta2/blob
  labels:
    testing.upbound.io/example-name: blob
  name: upteststorageaa9b5457f
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example-storage-blob

---

apiVersion: storage.azure.upbound.io/v1beta2
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta2/blob
  labels:
    testing.upbound.io/example-name: blob
  name: example-blob
spec:
  forProvider:
    containerAccessType: private
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: blob
