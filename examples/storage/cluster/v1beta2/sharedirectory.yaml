apiVersion: storage.azure.upbound.io/v1beta2
kind: ShareDirectory
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta2/sharedirectory
  labels:
    testing.upbound.io/example-name: sharedirectory
  name: sdexample
spec:
  forProvider:
    name: example
    storageShareUrlSelector:
      matchLabels:
        testing.upbound.io/example-name: sharedirectory

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta2/sharedirectory
  labels:
    testing.upbound.io/example-name: sharedirectory
  name: sdexample-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    location: West Europe

---

apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta2/sharedirectory
  labels:
    testing.upbound.io/example-name: sharedirectory
  name: sdexamplebumpta2020f0e
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: sharedirectory

---

apiVersion: storage.azure.upbound.io/v1beta2
kind: Share
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1beta2/sharedirectory
  labels:
    testing.upbound.io/example-name: sharedirectory
  name: sdexample
spec:
  forProvider:
    quota: 50
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: sharedirectory
