apiVersion: machinelearningservices.azure.upbound.io/v1beta1
kind: DatastoreBlobstorage
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/datastoreblobstorage
  labels:
    testing.upbound.io/example-name: datastoreblobstorage
  name: exampledatastore
spec:
  forProvider:
    accountKeySecretRef:
      key: attribute.primary_access_key
      name: example-mlds-blob-storage-account
      namespace: upbound-system
    description: Example blob storage datastore
    storageContainerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage
    workspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage

---

apiVersion: storage.azure.upbound.io/v1beta2
kind: Container
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/datastoreblobstorage
  labels:
    testing.upbound.io/example-name: datastoreblobstorage
  name: mldsblobcontainer
spec:
  forProvider:
    containerAccessType: private
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage

---

apiVersion: machinelearningservices.azure.upbound.io/v1beta2
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/datastoreblobstorage
  labels:
    testing.upbound.io/example-name: datastoreblobstorage
  name: mlds-blob-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    applicationInsightsIdSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage
    identity:
      type: SystemAssigned
    keyVaultIdSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage

---

apiVersion: insights.azure.upbound.io/v1beta2
kind: ApplicationInsights
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/datastoreblobstorage
  labels:
    testing.upbound.io/example-name: datastoreblobstorage
  name: datastoreblobstorage
spec:
  forProvider:
    applicationType: web
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage

---

apiVersion: keyvault.azure.upbound.io/v1beta3
kind: Vault
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/datastoreblobstorage
  labels:
    testing.upbound.io/example-name: datastoreblobstorage
  name: uptest-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    location: West Europe
    rbacAuthorizationEnabled: false
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage
    skuName: standard
    tenantId: ${data.azurerm_client_config.current.tenant_id}

---

apiVersion: storage.azure.upbound.io/v1beta3
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/datastoreblobstorage
  labels:
    testing.upbound.io/example-name: datastoreblobstorage
  name: mldsblobfa39440800
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: datastoreblobstorage
  writeConnectionSecretToRef:
    name: example-mlds-blob-storage-account
    namespace: upbound-system

---

apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/datastoreblobstorage
  labels:
    testing.upbound.io/example-name: datastoreblobstorage
  name: datastoreblobstorage
spec:
  forProvider:
    location: West Europe
