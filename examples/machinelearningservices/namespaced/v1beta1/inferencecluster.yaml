apiVersion: machinelearningservices.azure.m.upbound.io/v1beta1
kind: InferenceCluster
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/inferencecluster
  labels:
    testing.upbound.io/example-name: example
  name: exampleaic
  namespace: upbound-system
spec:
  forProvider:
    clusterPurpose: DevTest
    description: Example inference cluster
    kubernetesClusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    location: West Europe
    machineLearningWorkspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    tags:
      stage: example

---

apiVersion: containerservice.azure.m.upbound.io/v1beta1
kind: KubernetesCluster
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/inferencecluster
  labels:
    testing.upbound.io/example-name: example
  name: inferencecluster
  namespace: upbound-system
spec:
  forProvider:
    defaultNodePool:
      name: default
      nodeCount: 1
      upgradeSettings:
        maxSurge: 10%
      vmSize: Standard_DS2_v2
      vnetSubnetIdSelector:
        matchLabels:
          testing.upbound.io/example-name: example
    dnsPrefix: mlinferenceaks
    identity:
      type: SystemAssigned
    location: West Europe
    nodeProvisioningProfile:
      mode: Manual
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: network.azure.m.upbound.io/v1beta1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/inferencecluster
  labels:
    testing.upbound.io/example-name: example
  name: inferencecluster
  namespace: upbound-system
spec:
  forProvider:
    addressPrefixes:
    - 10.1.0.0/24
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    virtualNetworkNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: network.azure.m.upbound.io/v1beta1
kind: VirtualNetwork
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/inferencecluster
  labels:
    testing.upbound.io/example-name: example
  name: inferencecluster
  namespace: upbound-system
spec:
  forProvider:
    addressSpace:
    - 10.1.0.0/16
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: machinelearningservices.azure.m.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/inferencecluster
  labels:
    testing.upbound.io/example-name: example
  name: inferencecluster
  namespace: upbound-system
spec:
  forProvider:
    applicationInsightsIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    identity:
      type: SystemAssigned
    keyVaultIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    storageAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: insights.azure.m.upbound.io/v1beta1
kind: ApplicationInsights
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/inferencecluster
  labels:
    testing.upbound.io/example-name: example
  name: inferencecluster
  namespace: upbound-system
spec:
  forProvider:
    applicationType: web
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: keyvault.azure.m.upbound.io/v1beta1
kind: Vault
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/inferencecluster
  labels:
    testing.upbound.io/example-name: example
  name: uptest-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    skuName: standard
    tenantId: ${data.azurerm_client_config.current.tenant_id}

---

apiVersion: storage.azure.m.upbound.io/v1beta1
kind: Account
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/inferencecluster
  labels:
    testing.upbound.io/example-name: example
  name: mlinference6f3a
  namespace: upbound-system
spec:
  forProvider:
    accountReplicationType: LRS
    accountTier: Standard
    location: West Europe
    resourceGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  annotations:
    meta.upbound.io/example-id: machinelearningservices/v1beta1/inferencecluster
  labels:
    testing.upbound.io/example-name: example
  name: inferencecluster
  namespace: upbound-system
spec:
  forProvider:
    location: West Europe
